
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Clara</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        tailwind.config = {
            safelist: [
                'bg-shift-morning',
                'bg-shift-day',
                'bg-shift-afternoon',
                'bg-shift-night',
                'bg-shift-vacation'
            ],
            theme: {
                extend: {
                    colors: {
                        medical: {
                            50: '#f0f9fa',
                            100: '#dcfce7',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        },
                        shift: {
                            morning: '#fde047', // Yellow
                            day: '#d8b4fe',    // Purple
                            afternoon: '#f9a8d4', // Pink
                            night: '#5eead4',   // Turquoise
                            vacation: '#fb923c', // Orange
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f8fafc;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .note-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .note-modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .note-indicator {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
            color: #1f2937;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 4px;
            padding: 2px 3px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            border: 1px dashed rgba(0, 0, 0, 0.15);
        }

        .outing-badge {
            font-size: 11px;
            font-weight: 800;
            line-height: 1.2;
            border-radius: 5px;
            padding: 2px 3px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .outing-lunch {
            background-color: #fef08a;
            color: #854d0e;
            border: 1px solid #facc15;
        }

        .outing-dinner {
            background-color: #ddd6fe;
            color: #4c1d95;
            border: 1px solid #c4b5fd;
        }

        @media (min-width: 768px) {
            .note-indicator {
                font-size: 13px;
                padding: 3px 6px;
                white-space: normal;
                word-break: break-word;
            }
            .outing-badge {
                font-size: 13px;
                padding: 3px 6px;
                font-weight: 700;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <div id="error-display"
        style="display:none; padding: 20px; color: white; background: #ef4444; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; font-family: sans-serif;">
    </div>

    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            document.getElementById('error-display').style.display = 'block';
            document.getElementById('error-display').innerHTML = '<strong>App Error:</strong> ' + message + '<br><small>If you see a blank page, inspect your console for specific code issues.</small>';
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. VANILLA DATE UTILS ---
        const DateUtils = {
            addDays: (date, days) => {
                const result = new Date(date);
                result.setDate(result.getDate() + days);
                return result;
            },
            startOfWeek: (date) => {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                d.setDate(diff);
                d.setHours(0, 0, 0, 0);
                return d;
            },
            startOfMonth: (date) => new Date(date.getFullYear(), date.getMonth(), 1),
            endOfMonth: (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0),
            addWeeks: (date, weeks) => DateUtils.addDays(date, weeks * 7),
            subWeeks: (date, weeks) => DateUtils.addDays(date, -weeks * 7),
            addMonths: (date, months) => new Date(date.getFullYear(), date.getMonth() + months, 1),
            subMonths: (date, months) => new Date(date.getFullYear(), date.getMonth() - months, 1),
            isSameDay: (d1, d2) => d1.toDateString() === d2.toDateString(),
            isSameMonth: (d1, d2) => d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear(),
            formatMonthYear: (date) => date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }),
            formatDay: (date) => date.getDate(),
            formatIso: (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            },
            generateDays: (start, daysCount) => {
                const dates = [];
                for (let i = 0; i < daysCount; i++) {
                    dates.push(DateUtils.addDays(start, i));
                }
                return dates;
            }
        };

        // --- 2. ICONS ---
        const Icons = {
            ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6" /></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6" /></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></svg>,
            Moon: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>,
            Sun: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>,
            Sunset: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 10V2" /><path d="m4.93 10-1.41-1.41" /><path d="m20.49 8.59-1.41 1.41" /><path d="M2 18h2" /><path d="M20 18h2" /><path d="m6.34 11.66-1.41 1.41" /><path d="m19.07 10.93-1.41 1.41" /><path d="M16 18a4 4 0 0 0-8 0" /></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" x2="9" y1="12" y2="12" /></svg>,
            Umbrella: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12a10.06 10.06 1 0 0-1-10 10 10.06 10.06 1 0 0-1-10-10" /><path d="M12 12v8a2 2 0 0 0 4 0" /><path d="M12 2v1" /></svg>,
            Utensils: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/><path d="M15 2v14a2 2 0 0 1-2 2 2 2 0 0 1-2-2V2"/><path d="M6 2v20"/><path d="M2 2v4a4 4 0 0 0 8 0V2"/></svg>,
        };

        // --- 3. DATA ---
        const SHIFT_TYPES = {
            MORNING: { id: 'morning', label: 'M (8h-15h)', color: 'bg-shift-morning', icon: Icons.Sun },
            DAY: { id: 'day', label: 'D (8h-20h)', color: 'bg-shift-day', icon: Icons.Clock },
            AFTERNOON: { id: 'afternoon', label: 'T (13h-20h)', color: 'bg-shift-afternoon', icon: Icons.Sunset },
            NIGHT: { id: 'night', label: 'N (20h-8h)', color: 'bg-shift-night', icon: Icons.Moon },
            VACATION: { id: 'vacation', label: 'Vacation', color: 'bg-shift-vacation', icon: Icons.Umbrella },
        };

        // iCal subscription URL for Google Calendar (single source of truth)
        const SYNC_URL = 'https://jbbguvtvmddxcklxeeeb.supabase.co/functions/v1/shifts-ics';

        const SEEDED_SHIFTS = {
            // March
            '2026-03-02': 'afternoon', '2026-03-03': 'afternoon', '2026-03-04': 'afternoon', '2026-03-05': 'afternoon', '2026-03-06': 'afternoon',
            '2026-03-09': 'day', '2026-03-10': 'night',
            '2026-03-16': 'night',
            '2026-03-20': 'day', '2026-03-21': 'night',
            '2026-03-26': 'day', '2026-03-27': 'night',
            '2026-03-31': 'day',
            // February
            '2026-02-12': 'afternoon',
            '2026-02-13': 'afternoon',

            // April
            '2026-04-01': 'night',
            '2026-04-06': 'day', '2026-04-07': 'night',
            '2026-04-11': 'afternoon', '2026-04-12': 'night',
            '2026-04-17': 'day', '2026-04-18': 'night',
            '2026-04-22': 'day', '2026-04-23': 'night',
            '2026-04-28': 'day', '2026-04-29': 'night',
            // May
            '2026-05-03': 'day', '2026-05-04': 'night',
            '2026-05-09': 'day', '2026-05-10': 'night',
            '2026-05-14': 'day', '2026-05-15': 'night',
            '2026-05-20': 'day', '2026-05-21': 'night',
            '2026-05-25': 'afternoon', '2026-05-26': 'afternoon', '2026-05-27': 'afternoon', '2026-05-28': 'afternoon', '2026-05-29': 'afternoon',
            // June
            '2026-06-01': 'day', '2026-06-02': 'night',
            '2026-06-07': 'day', '2026-06-08': 'night',
            '2026-06-12': 'day', '2026-06-13': 'night',
            '2026-06-18': 'day', '2026-06-19': 'night',
            '2026-06-23': 'day', '2026-06-24': 'night',
            '2026-06-29': 'day', '2026-06-30': 'night',
            // August
            '2026-08-01': 'day', '2026-08-02': 'night',
            '2026-08-06': 'day', '2026-08-07': 'night',
            '2026-08-12': 'day', '2026-08-13': 'night',
            '2026-08-17': 'afternoon', '2026-08-18': 'afternoon', '2026-08-19': 'afternoon', '2026-08-20': 'afternoon', '2026-08-21': 'afternoon',
            '2026-08-24': 'day', '2026-08-25': 'night',
            '2026-08-31': 'night',
        };

        // Populate July Vacations cleanly
        for (let i = 1; i <= 31; i++) {
            const dayStr = String(i).padStart(2, '0');
            SEEDED_SHIFTS[`2026-07-${dayStr}`] = 'vacation';
        }

        const INITIAL_SHIFTS = SEEDED_SHIFTS;

        // --- 4. APP COMPONENTS ---
        const Login = ({ onLogin, onCancel }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === 'Clara') {
                    onLogin('admin');
                } else {
                    setError('Incorrect password');
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4 animate-fade-in">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 relative">
                        <div className="text-center mb-8">
                            <div className="bg-medical-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-medical-600">
                                <Icons.Lock />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800">Edit Mode</h2>
                            <p className="text-gray-500 mt-2">Enter password to make changes</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-medical-500 focus:border-transparent outline-none transition"
                                    placeholder="Password"
                                    autoFocus
                                />
                            </div>
                            {error && <p className="text-red-500 text-sm text-center">{error}</p>}
                            <div className="flex gap-3">
                                <button type="button" onClick={onCancel} className="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-lg transition duration-200">
                                    Cancel
                                </button>
                                <button type="submit" className="w-2/3 bg-medical-600 hover:bg-medical-700 text-white font-semibold py-3 rounded-lg transition duration-200">
                                    Access
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- 5. SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://jbbguvtvmddxcklxeeeb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C3Fp8maSqqEF2zIzgKos9w__pAKImCj';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [userRole, setUserRole] = useState('guest'); // 'admin' | 'guest'
            const [showLogin, setShowLogin] = useState(false);
            const [showSync, setShowSync] = useState(false);
            const [copied, setCopied] = useState(false);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [view, setView] = useState('week');
            const [shifts, setShifts] = useState(INITIAL_SHIFTS);
            const [notes, setNotes] = useState({});
            const [lunchTimes, setLunchTimes] = useState({});
            const [dinnerTimes, setDinnerTimes] = useState({});
            const [noteModal, setNoteModal] = useState(null);
            const [noteText, setNoteText] = useState('');
            const [modalLunchTime, setModalLunchTime] = useState('');
            const [modalDinnerTime, setModalDinnerTime] = useState('');
            const [longPressTimer, setLongPressTimer] = useState(null);

            useEffect(() => {
                const fetchShifts = async () => {
                    const { data, error } = await supabase.from('shifts').select('*');
                    if (error) {
                        console.error("Error fetching shifts:", error);
                        return;
                    }

                    if (data) {
                        const dbShifts = {};
                        const dbNotes = {};
                        const dbLunch = {};
                        const dbDinner = {};
                        data.forEach(row => {
                            dbShifts[row.date] = row.shift_type === 'none' ? null : row.shift_type;
                            if (row.note) dbNotes[row.date] = row.note;
                            if (row.lunch_time) dbLunch[row.date] = row.lunch_time;
                            if (row.dinner_time) dbDinner[row.date] = row.dinner_time;
                        });

                        setShifts(prev => ({
                            ...prev,
                            ...dbShifts
                        }));
                        setNotes(dbNotes);
                        setLunchTimes(dbLunch);
                        setDinnerTimes(dbDinner);
                    }
                };

                fetchShifts();
            }, []);

            const headerTitle = useMemo(() => DateUtils.formatMonthYear(currentDate), [currentDate]);

            const days = useMemo(() => {
                if (view === 'week') {
                    const start = DateUtils.startOfWeek(currentDate);
                    return DateUtils.generateDays(start, 7);
                } else {
                    const startMonth = DateUtils.startOfMonth(currentDate);
                    const startGrid = DateUtils.startOfWeek(startMonth);
                    return DateUtils.generateDays(startGrid, 42);
                }
            }, [currentDate, view]);

            const navigate = (direction) => {
                if (view === 'week') {
                    setCurrentDate(prev => direction === 1 ? DateUtils.addWeeks(prev, 1) : DateUtils.subWeeks(prev, 1));
                } else {
                    setCurrentDate(prev => direction === 1 ? DateUtils.addMonths(prev, 1) : DateUtils.subMonths(prev, 1));
                }
            };

            const toggleShift = async (dateStr) => {
                if (userRole !== 'admin') return;

                const current = shifts[dateStr];
                let nextValue;
                if (!current) nextValue = 'morning';
                else if (current === 'morning') nextValue = 'day';
                else if (current === 'day') nextValue = 'afternoon';
                else if (current === 'afternoon') nextValue = 'night';
                else if (current === 'night') nextValue = 'vacation';
                else nextValue = null;

                if (nextValue) {
                    setShifts(prev => ({ ...prev, [dateStr]: nextValue }));
                } else {
                    setShifts(prev => {
                        const copy = { ...prev };
                        delete copy[dateStr];
                        return copy;
                    });
                }

                const dbValue = nextValue || 'none';

                const { error } = await supabase
                    .from('shifts')
                    .upsert({
                        date: dateStr,
                        shift_type: dbValue,
                        note: notes[dateStr] || null,
                        lunch_time: lunchTimes[dateStr] || null,
                        dinner_time: dinnerTimes[dateStr] || null
                    });

                if (error) {
                    console.error("Error saving shift:", error);
                    alert("Error saving to database: " + error.message);
                } else {
                    let shiftName = "Cleared";
                    if (nextValue) {
                        const shiftDetail = Object.values(SHIFT_TYPES).find(t => t.id === nextValue);
                        if (shiftDetail) shiftName = shiftDetail.label;
                    }

                    const message = `Hello! My shift on ${dateStr} has been updated to: ${shiftName}.`;
                    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;

                    if (window.confirm(`Shift updated! Do you want to share this update to WhatsApp?\n\nMessage: "${message}"`)) {
                        window.open(whatsappUrl, '_blank');
                    }
                }
            };

            const openNoteModal = (dateStr, e) => {
                if (e) e.preventDefault();
                setNoteModal(dateStr);
                setNoteText(notes[dateStr] || '');
                setModalLunchTime(lunchTimes[dateStr] || '');
                setModalDinnerTime(dinnerTimes[dateStr] || '');
            };

            const closeNoteModal = () => {
                setNoteModal(null);
                setNoteText('');
                setModalLunchTime('');
                setModalDinnerTime('');
            };

            const handleCopySyncUrl = async () => {
                try {
                    await navigator.clipboard.writeText(SYNC_URL);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1500);
                } catch (err) {
                    window.alert('Could not copy automatically. Please copy the link manually:\n\n' + SYNC_URL);
                }
            };

            const saveDetails = async () => {
                if (!noteModal) return;
                const dateStr = noteModal;
                const trimmedNote = noteText.trim();
                const trimmedLunch = modalLunchTime.trim();
                const trimmedDinner = modalDinnerTime.trim();

                // Update local state
                if (trimmedNote) {
                    setNotes(prev => ({ ...prev, [dateStr]: trimmedNote }));
                } else {
                    setNotes(prev => {
                        const copy = { ...prev };
                        delete copy[dateStr];
                        return copy;
                    });
                }

                if (trimmedLunch) {
                    setLunchTimes(prev => ({ ...prev, [dateStr]: trimmedLunch }));
                } else {
                    setLunchTimes(prev => {
                        const copy = { ...prev };
                        delete copy[dateStr];
                        return copy;
                    });
                }

                if (trimmedDinner) {
                    setDinnerTimes(prev => ({ ...prev, [dateStr]: trimmedDinner }));
                } else {
                    setDinnerTimes(prev => {
                        const copy = { ...prev };
                        delete copy[dateStr];
                        return copy;
                    });
                }

                const currentShift = shifts[dateStr] || 'none';
                const { error } = await supabase
                    .from('shifts')
                    .upsert({
                        date: dateStr,
                        shift_type: currentShift,
                        note: trimmedNote || null,
                        lunch_time: trimmedLunch || null,
                        dinner_time: trimmedDinner || null
                    });

                if (error) {
                    console.error('Error saving details:', error);
                    alert('Error saving details: ' + error.message);
                } else {
                    const parts = [];
                    if (trimmedLunch) parts.push(`🍽️ Salida a comer a las ${trimmedLunch}`);
                    if (trimmedDinner) parts.push(`🌙 Salida a cenar a las ${trimmedDinner}`);
                    if (trimmedNote) parts.push(`Nota: "${trimmedNote}"`);

                    const detailsStr = parts.length > 0 ? parts.join(' | ') : 'Detalles eliminados';
                    const message = `Actualización para ${dateStr}: ${detailsStr}`;
                    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;

                    if (window.confirm(`Guardado correctamente. ¿Quieres compartir este detalle por WhatsApp?\n\n"${message}"`)) {
                        window.open(whatsappUrl, '_blank');
                    }
                }

                closeNoteModal();
            };

            const handleTouchStart = (dateStr, e) => {
                const timer = setTimeout(() => {
                    openNoteModal(dateStr);
                }, 600);
                setLongPressTimer(timer);
            };

            const handleTouchEnd = () => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    setLongPressTimer(null);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-20">
                    <header className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                            <h1 className="text-xl font-bold text-gray-800 capitalize flex items-center gap-2">
                                <span className="bg-medical-100 p-2 rounded-lg text-medical-600"><Icons.Calendar /></span>
                                {headerTitle}
                            </h1>
                            <div className="flex items-center gap-2">
                                {userRole === 'admin' ? (
                                    <>
                                        <span className="text-xs font-medium text-medical-600 flex items-center gap-1 bg-medical-50 px-2 py-1 rounded-full border border-medical-100 hidden sm:flex">
                                            <div className="w-2 h-2 rounded-full bg-medical-500 animate-pulse"></div>
                                            Auto-Sync
                                        </span>
                                        <button onClick={() => setShowSync(true)} className="px-3 py-1.5 bg-white border border-medical-200 hover:bg-medical-50 text-medical-600 text-sm font-medium rounded-lg transition flex items-center gap-1.5" title="Sync with Google Calendar">
                                            <Icons.Calendar />
                                            <span>Google Calendar</span>
                                        </button>
                                        <button onClick={() => setUserRole('guest')} className="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition" title="Exit Edit Mode">
                                            Done
                                        </button>
                                    </>
                                ) : (
                                    <button onClick={() => setShowLogin(true)} className="px-3 py-1.5 bg-medical-600 hover:bg-medical-700 text-white text-sm font-medium rounded-lg transition flex items-center gap-1.5">
                                        <div className="w-4 h-4 flex items-center justify-center shrink-0"><Icons.Lock /></div>
                                        <span>Edit</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="max-w-4xl mx-auto px-4 pb-4 flex items-center justify-between">
                            <div className="flex bg-gray-100 rounded-lg p-1">
                                <button onClick={() => setView('week')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition ${view === 'week' ? 'bg-white shadow text-gray-900' : 'text-gray-500'}`}>Week</button>
                                <button onClick={() => setView('month')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition ${view === 'month' ? 'bg-white shadow text-gray-900' : 'text-gray-500'}`}>Month</button>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => navigate(-1)} className="p-2 hover:bg-gray-100 rounded-full transition"><Icons.ChevronLeft /></button>
                                <button onClick={() => navigate(1)} className="p-2 hover:bg-gray-100 rounded-full transition"><Icons.ChevronRight /></button>
                            </div>
                        </div>

                        <div className="max-w-4xl mx-auto px-4 grid grid-cols-7 gap-1 text-center pb-2">
                            {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => (
                                <div key={d} className="text-xs font-semibold text-gray-400 uppercase tracking-wide">{d}</div>
                            ))}
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 pt-4">
                        <div className={`grid grid-cols-7 gap-2 ${view === 'month' ? 'auto-rows-fr' : ''}`}>
                            {days.map((day) => {
                                const dateStr = DateUtils.formatIso(day);
                                const isToday = DateUtils.isSameDay(day, new Date());
                                const isCurrentMonth = DateUtils.isSameMonth(day, currentDate);
                                const shiftId = shifts[dateStr];
                                const shift = shiftId ? Object.values(SHIFT_TYPES).find(t => t.id === shiftId) : null;

                                const opacityClass = (view === 'month' && !isCurrentMonth) ? 'opacity-30' : 'opacity-100';
                                const ShiftIcon = shift ? shift.icon : null;
                                const dayNote = notes[dateStr];
                                const dayLunch = lunchTimes[dateStr];
                                const dayDinner = dinnerTimes[dateStr];

                                return (
                                    <div
                                        key={dateStr}
                                        onClick={() => toggleShift(dateStr)}
                                        onContextMenu={(e) => openNoteModal(dateStr, e)}
                                        onTouchStart={(e) => handleTouchStart(dateStr, e)}
                                        onTouchEnd={handleTouchEnd}
                                        onTouchMove={handleTouchEnd}
                                        title={dayNote ? `📝 ${dayNote}` : 'Click derecho / mantener pulsado para notas o salidas'}
                                        className={`
                                            relative min-h-[6.5rem] md:min-h-[8.5rem] w-full rounded-xl border-2 transition cursor-pointer flex flex-col justify-between p-1 md:p-2 shadow-sm
                                            ${isToday ? 'border-medical-500 ring-2 ring-medical-500 ring-offset-1 z-10' : 'border-gray-200/80 hover:border-medical-300'}
                                            ${shift ? shift.color : (isToday ? 'bg-medical-50/50' : 'bg-white')}
                                            ${opacityClass}
                                        `}
                                    >
                                         {/* Header of the cell: Day number and Shift Icon/Label */}
                                         <div className="w-full flex items-center justify-between">
                                             <span className={`text-sm md:text-base font-bold ${shift ? 'text-gray-900' : 'text-gray-600'}`}>
                                                 {DateUtils.formatDay(day)}
                                             </span>
                                             {shift && (
                                                 <div className="flex items-center gap-1">
                                                     <div className="text-gray-800 opacity-90 transform scale-75 md:scale-90"><ShiftIcon /></div>
                                                     <span className="text-[10px] uppercase font-black text-gray-800 tracking-wider hidden lg:inline">{shift.label.split(' ')[0]}</span>
                                                 </div>
                                             )}
                                         </div>

                                         {/* Center of the cell: Shift Label on mobile if active */}
                                         {shift && (
                                             <div className="w-full text-center py-0.5">
                                                 <span className="text-[10px] md:text-xs font-black uppercase text-gray-800 bg-white/60 px-1.5 py-0.5 rounded backdrop-blur-sm block truncate">
                                                     {shift.label}
                                                 </span>
                                             </div>
                                         )}
                                         
                                         {/* Bottom of the cell: Full width Outing and Note Badges */}
                                         <div className="w-full flex flex-col gap-1 mt-auto">
                                             {dayLunch && (
                                                 <div className="outing-badge outing-lunch" title={`Salida a comer: ${dayLunch}`}>
                                                     <span className="text-xs">🍽️</span> <span>{dayLunch}</span>
                                                 </div>
                                             )}
                                             {dayDinner && (
                                                 <div className="outing-badge outing-dinner" title={`Salida a cenar: ${dayDinner}`}>
                                                     <span className="text-xs">🌙</span> <span>{dayDinner}</span>
                                                 </div>
                                             )}
                                             {dayNote && (
                                                 <div className="note-indicator" title={dayNote}>
                                                     📝 {dayNote}
                                                 </div>
                                             )}
                                         </div>
                                     </div>
                                 );
                            })}
                        </div>
                    </main>

                    {noteModal && (
                        <div className="note-modal-overlay" onClick={closeNoteModal}>
                            <div className="note-modal max-w-lg" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                        <span>📅</span> {noteModal}
                                    </h3>
                                    <span className="text-xs px-2 py-1 bg-gray-100 rounded-full font-medium text-gray-600">
                                        {userRole === 'admin' ? 'Editar Día' : 'Detalles'}
                                    </span>
                                </div>

                                {userRole === 'admin' ? (
                                    <div className="space-y-4">
                                        {/* Salidas Familiares Section */}
                                        <div className="p-3 bg-amber-50/60 rounded-xl border border-amber-100 space-y-3">
                                            <div className="font-semibold text-xs text-amber-900 uppercase tracking-wider flex items-center gap-1.5">
                                                <span>👨‍👩‍👧</span> Salidas Familiares / Llegada Padres
                                            </div>

                                            {/* Comida */}
                                            <div className="flex items-center justify-between gap-2">
                                                <label className="text-sm font-medium text-gray-700 flex items-center gap-1.5 shrink-0">
                                                    <span>🍽️</span> Salida Comida:
                                                </label>
                                                <div className="flex items-center gap-1.5">
                                                    <input
                                                        type="time"
                                                        value={modalLunchTime}
                                                        onChange={e => setModalLunchTime(e.target.value)}
                                                        className="px-2 py-1.5 text-sm border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none"
                                                    />
                                                    {modalLunchTime && (
                                                        <button
                                                            type="button"
                                                            onClick={() => setModalLunchTime('')}
                                                            className="text-xs text-red-500 hover:text-red-700 p-1 font-bold"
                                                            title="Borrar hora de comida"
                                                        >
                                                            ✕
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            {/* Botones rápidos Comida */}
                                            <div className="flex items-center gap-1 text-xs">
                                                <span className="text-gray-400">Rápido:</span>
                                                {['11:30', '13:00', '14:00', '14:30'].map(t => (
                                                    <button
                                                        key={t}
                                                        type="button"
                                                        onClick={() => setModalLunchTime(t)}
                                                        className={`px-2 py-0.5 rounded border transition ${modalLunchTime === t ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                                                    >
                                                        {t}
                                                    </button>
                                                ))}
                                            </div>

                                            {/* Cena */}
                                            <div className="flex items-center justify-between gap-2 pt-1 border-t border-amber-100">
                                                <label className="text-sm font-medium text-gray-700 flex items-center gap-1.5 shrink-0">
                                                    <span>🌙</span> Salida Cena:
                                                </label>
                                                <div className="flex items-center gap-1.5">
                                                    <input
                                                        type="time"
                                                        value={modalDinnerTime}
                                                        onChange={e => setModalDinnerTime(e.target.value)}
                                                        className="px-2 py-1.5 text-sm border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                    />
                                                    {modalDinnerTime && (
                                                        <button
                                                            type="button"
                                                            onClick={() => setModalDinnerTime('')}
                                                            className="text-xs text-red-500 hover:text-red-700 p-1 font-bold"
                                                            title="Borrar hora de cena"
                                                        >
                                                            ✕
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            {/* Botones rápidos Cena */}
                                            <div className="flex items-center gap-1 text-xs">
                                                <span className="text-gray-400">Rápido:</span>
                                                {['20:00', '20:30', '21:00', '21:30'].map(t => (
                                                    <button
                                                        key={t}
                                                        type="button"
                                                        onClick={() => setModalDinnerTime(t)}
                                                        className={`px-2 py-0.5 rounded border transition ${modalDinnerTime === t ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                                                    >
                                                        {t}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Nota general */}
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">
                                                📝 Nota adicional
                                            </label>
                                            <textarea
                                                value={noteText}
                                                onChange={e => setNoteText(e.target.value)}
                                                placeholder="Ej: Salimos a comer al restaurante X, vienen los abuelos..."
                                                className="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-medical-500 focus:border-transparent resize-none"
                                                rows={2}
                                                maxLength={100}
                                            />
                                            <p className="text-[11px] text-gray-400 text-right mt-0.5">{noteText.length}/100</p>
                                        </div>

                                        <div className="flex gap-2 pt-2">
                                            <button onClick={closeNoteModal} className="flex-1 px-4 py-2 rounded-lg border border-gray-200 text-gray-600 text-sm hover:bg-gray-50 transition">
                                                Cancelar
                                            </button>
                                            <button onClick={saveDetails} className="flex-1 px-4 py-2 rounded-lg bg-medical-600 text-white text-sm font-medium hover:bg-medical-700 transition">
                                                Guardar Cambios
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {(lunchTimes[noteModal] || dinnerTimes[noteModal]) && (
                                            <div className="p-3 bg-amber-50 rounded-xl border border-amber-100 space-y-2">
                                                <div className="text-xs font-bold text-amber-900 uppercase">👨‍👩‍👧 Salidas programadas:</div>
                                                {lunchTimes[noteModal] && (
                                                    <div className="text-sm font-medium text-amber-900 flex items-center gap-2">
                                                        <span>🍽️</span> Salida a comer: <strong className="bg-white px-2 py-0.5 rounded border border-amber-200">{lunchTimes[noteModal]}</strong>
                                                    </div>
                                                )}
                                                {dinnerTimes[noteModal] && (
                                                    <div className="text-sm font-medium text-indigo-900 flex items-center gap-2">
                                                        <span>🌙</span> Salida a cenar: <strong className="bg-white px-2 py-0.5 rounded border border-indigo-200">{dinnerTimes[noteModal]}</strong>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        <div>
                                            <div className="text-xs font-semibold text-gray-400 uppercase mb-1">Nota:</div>
                                            <div className="bg-gray-50 rounded-lg p-3 text-sm text-gray-700 min-h-[50px]">
                                                {notes[noteModal] || <span className="text-gray-400 italic">Sin nota adicional</span>}
                                            </div>
                                        </div>

                                        <button onClick={closeNoteModal} className="w-full mt-2 px-4 py-2 rounded-lg border border-gray-200 text-gray-600 text-sm hover:bg-gray-50 transition">
                                            Cerrar
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {showSync && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4 animate-fade-in" onClick={() => setShowSync(false)}>
                            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 relative" onClick={e => e.stopPropagation()}>
                                <h2 className="text-xl font-bold text-gray-800 mb-1">Google Calendar</h2>
                                <p className="text-gray-500 text-sm mb-4">Subscribe to Clara's shifts in Google Calendar</p>
                                <input
                                    readOnly
                                    value={SYNC_URL}
                                    onFocus={(e) => e.target.select()}
                                    className="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm text-gray-700 bg-gray-50 mb-3"
                                />
                                <div className="flex gap-2 mb-4">
                                    <button onClick={handleCopySyncUrl} className="flex-1 px-4 py-2 rounded-lg bg-medical-500 text-white text-sm font-medium hover:bg-medical-600 transition">
                                        {copied ? 'Copied!' : 'Copy'}
                                    </button>
                                    <button onClick={() => setShowSync(false)} className="flex-1 px-4 py-2 rounded-lg border border-gray-200 text-gray-600 text-sm hover:bg-gray-50 transition">
                                        Close
                                    </button>
                                </div>
                                <div className="space-y-1 text-gray-500 text-sm">
                                    <p>1. Open Google Calendar on your phone or computer</p>
                                    <p>2. Go to Other calendars → Add by URL</p>
                                    <p>3. Paste the link above and press Add</p>
                                    <p>4. Updates appear automatically (can take a few hours)</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLogin && (
                        <Login
                            onLogin={(role) => {
                                setUserRole(role);
                                setShowLogin(false);
                            }}
                            onCancel={() => setShowLogin(false)}
                        />
                    )}

                    <footer className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 safe-area-pb">
                        <div className="max-w-4xl mx-auto flex flex-wrap justify-center gap-4 text-xs">
                            {Object.values(SHIFT_TYPES).map(type => (
                                <div key={type.id} className="flex items-center gap-2">
                                    <div className={`w-4 h-4 rounded ${type.color}`}></div>
                                    <span className="font-medium text-gray-600">{type.label}</span>
                                </div>
                            ))}
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
